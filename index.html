<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaka Player - ClearKey Test</title>
  <!-- UI Shaka Player -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #111; color: #fff; padding: 20px; }
    .controls { display: flex; flex-direction: column; gap: 10px; max-width: 600px; margin-bottom: 20px; }
    input, button { padding: 10px; border-radius: 8px; border: 1px solid #444; font-size: 14px; }
    input { background: #222; color: #fff; }
    button { background: #007aff; color: #fff; font-weight: bold; border: none; cursor: pointer; }
    #video-container { max-width: 800px; width: 100%; aspect-ratio: 16/9; }
    video { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <h2>Test Riproduzione DASH + ClearKey</h2>

  <div class="controls">
    <input type="text" id="manifestUri" placeholder="URL Manifest (.mpd con token)" />
    <input type="text" id="keyId" placeholder="Key ID (Hex a 32 caratteri)" />
    <input type="text" id="keyHex" placeholder="Key (Hex a 32 caratteri)" />
    <button id="loadBtn">Carica Flusso</button>
  </div>

  <div id="video-container" data-shaka-player-container>
    <video id="video" data-shaka-player autoplay playsinline></video>
  </div>

  <script>
    async function initApp() {
      // Installa i polyfill necessari per iOS WebKit / EME
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        alert("Browser non supportato per questo stack EME");
        return;
      }

      const video = document.getElementById('video');
      const player = new shaka.Player(video);

      // Gestione errori
      player.addEventListener('error', (event) => {
        console.error('Errore Shaka:', event.detail);
        alert('Errore Shaka: ' + event.detail.message);
      });

      document.getElementById('loadBtn').addEventListener('click', async () => {
        const manifest = document.getElementById('manifestUri').value.trim();
        const kid = document.getElementById('keyId').value.trim();
        const key = document.getElementById('keyHex').value.trim();

        // Configurazione ClearKey DRM
        const drmConfig = {};
        if (kid && key) {
          drmConfig.clearKeys = {};
          drmConfig.clearKeys[kid] = key;
        }

        player.configure({ drm: drmConfig });

        try {
          await player.load(manifest);
          console.log('Flusso caricato con successo!');
        } catch (e) {
          console.error('Errore di caricamento:', e);
          alert('Errore caricamento: ' + e.message);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
